<!DOCTYPE html>
<!--
  ARCHITECTURE MAP / SƠ ĐỒ KIẾN TRÚC KHỐI — mẫu của SA, Duy SDLC Kit
  ===========================================================================
  MỤC ĐÍCH: 1 trang HTML để nhìn KIẾN TRÚC TỔNG THỂ theo TẦNG & KHỐI —
    • Phân tầng: Client → Cổng → Dịch vụ → Dữ liệu → Tích hợp ngoài → Hạ tầng xuyên suốt
    • Mỗi KHỐI: công nghệ (badge), phục vụ module/FR nào, mô tả ngắn
    • Đường LUỒNG (connector) giữa các khối; danh sách LUỒNG CHÍNH end-to-end
    • Trạng thái khối (nâng cấp): Thêm mới / Thay đổi / Giữ nguyên / Ngoài phạm vi
  Đi KÈM (không thay) HLD.md — .md là nguồn sự thật đặc tả; HTML này để "dễ nhìn".
  Sinh ở B2 (cùng HLD). Lưu: docs/sa/architecture.html
    (kiểu B microservices: docs/system_architecture.html — đi cùng system_architecture.md).

  CÁCH DÙNG (SA): CHỈ sửa biến DATA. layers[].blocks[] = các khối; edges = luồng nối
    (from→to theo id khối); flows = luồng chính dạng chữ. status: 'new'|'change'|'keep'|'na' (tuỳ chọn).
  Ví dụ dùng tình huống "gói cước data" — THAY bằng dự án thật rồi xoá phần mẫu.
-->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture Map — Sơ đồ kiến trúc khối</title>
<style>
  :root{
    --bg:#f4f6f8;--card:#fff;--ink:#1f2733;--muted:#69727f;--line:#e5e9ef;
    --accent:#f26a21;--new:#1f9d55;--change:#c98a12;--keep:#5566;--na:#98a2b0;
    --new-bg:#e9f7ef;--change-bg:#fbf1de;--na-bg:#eef1f5;--edge:#c3cad4;
    --lb:#eef2f7;--tech:#eef1f6;--tech-ink:#42506a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 26px 70px}
  .kick{font:600 12px/1.4 ui-monospace,monospace;letter-spacing:.14em;color:#1a7f8c;text-transform:uppercase;margin-bottom:6px}
  h1{margin:0 0 8px;font-size:29px;font-weight:800;letter-spacing:-.5px}
  .lead{color:#40474f;max-width:800px;margin:0 0 6px}
  .meta{color:var(--muted);font-size:13px}
  .stats{display:flex;flex-wrap:wrap;gap:14px;margin:18px 0 8px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 18px;min-width:140px;flex:1}
  .tile .n{font-size:28px;font-weight:800;line-height:1}
  .tile .l{font-size:12.5px;color:var(--muted);margin-top:6px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin:6px 0 4px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .dot.new{background:var(--new)}.dot.change{background:var(--change)}.dot.keep{background:#9aa4b2}.dot.na{background:var(--na)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
  .tools input{padding:8px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;min-width:220px;flex:1;max-width:360px}
  /* diagram */
  #diagram{position:relative}
  #edges{position:absolute;top:0;left:0;pointer-events:none;z-index:0}
  .layer{position:relative;z-index:1;display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:stretch;margin:0 0 30px}
  .llabel{font-weight:700;font-size:13px;color:#3a4353;background:var(--lb);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;justify-content:center}
  .llabel small{font-weight:500;color:var(--muted);font-size:11.5px;margin-top:3px}
  .blocks{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start}
  .block{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;min-width:170px;max-width:250px;flex:1;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .block.new{border-left:4px solid var(--new)} .block.change{border-left:4px solid var(--change)} .block.keep{border-left:4px solid #9aa4b2} .block.na{border-left:4px dashed var(--na);opacity:.72}
  .bname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
  .bserves{font:11px/1.3 ui-monospace,monospace;color:var(--muted);margin-top:2px}
  .bdesc{color:#4a515a;font-size:12px;margin-top:5px}
  .techs{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .tech{font-size:10.5px;font-weight:600;background:var(--tech);color:var(--tech-ink);padding:2px 7px;border-radius:5px}
  .stag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:auto}
  .stag.new{background:var(--new-bg);color:var(--new)} .stag.change{background:var(--change-bg);color:var(--change)} .stag.na{background:var(--na-bg);color:var(--na)}
  .dim{opacity:.25;transition:opacity .15s}
  .hot{outline:2px solid var(--accent);outline-offset:2px}
  /* flows */
  .flows{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:6px}
  .flows h3{margin:0 0 8px;font-size:15px}
  .flow{padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
  .flow:first-of-type{border-top:0}
  .flow b{color:#2a3340}
  .flow .st{font:12px/1.5 ui-monospace,monospace;color:#3a4a63}
  footer{max-width:1200px;margin:0 auto;padding:14px 26px 40px;color:var(--muted);font-size:12px}
  @media print{.tools{display:none}.layer,.flows,.block{break-inside:avoid}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kick" id="kick"></div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <div class="meta" id="meta"></div>
  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>
  <div class="tools"><input type="search" id="q" placeholder="🔎 Tô sáng khối / công nghệ / module…"></div>
  <div id="diagram"><svg id="edges"></svg><div id="layers"></div></div>
  <div id="flows"></div>
</div>
<footer id="foot"></footer>

<script>
/* ===================== SA CHỈ SỬA PHẦN DATA NÀY ===================== */
const DATA = {
  project:"Dự án mẫu — Quản lý gói cước",
  archStyle:"Modular monolith → tách dần service",
  updated:"2026-08",
  showStatus:true,   // hiện trạng thái khối (nâng cấp). Dự án mới hoàn toàn có thể để false.
  layers:[
    { id:"L1", name:"Kênh / Client", note:"App & CMS", blocks:[
      {id:"app", name:"Mobile App", techs:["React Native"], serves:"Thuê bao", desc:"Đăng ký/hủy/gia hạn gói."},
      {id:"cms", name:"CMS Web", techs:["Angular"], serves:"CSKH · Admin", desc:"Tra cứu, quản trị danh mục."}
    ]},
    { id:"L2", name:"Cổng / Edge", note:"vào 1 cửa", blocks:[
      {id:"gw", name:"API Gateway", techs:["Spring Cloud Gateway"], desc:"Định tuyến, rate-limit, JWT."},
      {id:"auth", name:"Auth (JWT/OAuth2)", techs:["Spring Security","Keycloak?"], desc:"Xác thực & phát token."}
    ]},
    { id:"L3", name:"Dịch vụ", note:"Spring Boot", blocks:[
      {id:"svc-sub", name:"Subscription Service", techs:["Spring Boot","Java 21"], serves:"M1 · FR-01→03", status:"change", desc:"Đăng ký/hủy gói; auto-renew."},
      {id:"svc-cus", name:"Customer Service", techs:["Spring Boot"], serves:"M2 · FR-10→11", desc:"Tra cứu thuê bao (CSKH)."},
      {id:"svc-adm", name:"Catalog/Admin Service", techs:["Spring Boot"], serves:"M3 · FR-20→21", desc:"Quản trị danh mục, báo cáo."},
      {id:"svc-noti", name:"Notification Service", techs:["Spring Boot"], serves:"FR-02.3", status:"new", desc:"Gửi SMS/thông báo qua sự kiện."}
    ]},
    { id:"L4", name:"Dữ liệu", note:"lưu trữ", blocks:[
      {id:"pg", name:"PostgreSQL 16", techs:["RDBMS"], desc:"CSDL giao dịch chính."},
      {id:"redis", name:"Redis", techs:["Cache"], desc:"Cache đọc nóng, đạt P95<300ms."},
      {id:"kafka", name:"Kafka", techs:["Event bus"], status:"new", desc:"Sự kiện đăng ký → Notification."}
    ]},
    { id:"L5", name:"Tích hợp ngoài", note:"hệ thứ 3", blocks:[
      {id:"billing", name:"Hệ tính cước (Billing)", techs:["REST"], desc:"Trừ tiền/kiểm số dư."},
      {id:"sms", name:"SMS Gateway", techs:["SMPP/REST"], desc:"Gửi SMS xác nhận."},
      {id:"otp", name:"OTP Provider", techs:["REST"], desc:"Gửi OTP đăng nhập."}
    ]},
    { id:"L6", name:"Xuyên suốt", note:"cross-cutting", blocks:[
      {id:"log", name:"Logging (ELK)", techs:["Elastic"], desc:"Log tập trung, traceId."},
      {id:"mon", name:"Monitoring", techs:["Prometheus","Grafana"], desc:"Metrics, cảnh báo."},
      {id:"cicd", name:"CI/CD", techs:["GitLab CI"], desc:"Build/test/deploy."},
      {id:"sec", name:"Secret Manager", techs:["Vault"], desc:"Quản lý secret (PDPL)."}
    ]}
  ],
  edges:[
    {from:"app",to:"gw"},{from:"cms",to:"gw"},
    {from:"gw",to:"svc-sub"},{from:"gw",to:"svc-cus"},{from:"gw",to:"svc-adm"},
    {from:"svc-sub",to:"pg"},{from:"svc-sub",to:"redis"},{from:"svc-sub",to:"kafka"},{from:"svc-sub",to:"billing"},
    {from:"svc-cus",to:"pg"},{from:"svc-adm",to:"pg"},
    {from:"kafka",to:"svc-noti"},{from:"svc-noti",to:"sms"}
  ],
  flows:[
    {name:"Đăng ký gói (FR-02)", steps:"App → Gateway → Subscription → (Billing trừ tiền · PostgreSQL) → Kafka → Notification → SMS"},
    {name:"CSKH tra cứu (FR-10)", steps:"CMS → Gateway → Customer Service → PostgreSQL"}
  ]
};
/* =================== HẾT PHẦN SA CẦN SỬA =================== */

const STAG={new:"Thêm mới",change:"Thay đổi",na:"Ngoài phạm vi"};
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const allBlocks=()=>DATA.layers.flatMap(l=>l.blocks);
const nExt=(DATA.layers.find(l=>/ngoài/i.test(l.name))||{blocks:[]}).blocks.length;
const nSvc=(DATA.layers.find(l=>/dịch vụ/i.test(l.name))||{blocks:[]}).blocks.length;

document.getElementById('kick').textContent=[DATA.project,DATA.archStyle,"KIẾN TRÚC TỔNG THỂ","CẬP NHẬT "+DATA.updated].filter(Boolean).join("  ·  ");
document.getElementById('title').textContent="Sơ đồ kiến trúc khối theo tầng";
document.getElementById('lead').innerHTML="Kiến trúc phân tầng: <b>Client → Cổng → Dịch vụ → Dữ liệu → Tích hợp ngoài</b>, kèm hạ tầng xuyên suốt. Mỗi khối ghi công nghệ + module phục vụ. Trang này <b>đi kèm</b> (không thay) <code>HLD.md</code> — .md là nguồn sự thật đặc tả.";
document.getElementById('meta').textContent=`${DATA.layers.length} tầng · ${allBlocks().length} khối · ${nSvc} service · ${nExt} tích hợp ngoài · Kiểu kiến trúc: ${DATA.archStyle}`;
document.getElementById('foot').textContent="Sinh bởi SA (Duy SDLC Kit) ở B2, đi kèm HLD.md. Sơ đồ để 'dễ nhìn'; mọi quyết định & đặc tả kiến trúc nằm ở HLD.md (nguồn sự thật).";

// stats
let sc={new:0,change:0,keep:0,na:0}; allBlocks().forEach(b=>sc[b.status||'keep']++);
const tiles=[{n:DATA.layers.length,l:"Tầng"},{n:allBlocks().length,l:"Khối"},{n:nSvc,l:"Service"},{n:nExt,l:"Tích hợp ngoài"}];
if(DATA.showStatus){tiles.push({n:sc.new,l:"Thêm mới"}); if(sc.change)tiles.push({n:sc.change,l:"Thay đổi"});}
document.getElementById('stats').innerHTML=tiles.map(t=>`<div class="tile"><div class="n">${t.n}</div><div class="l">${t.l}</div></div>`).join('');

// legend
document.getElementById('legend').innerHTML = DATA.showStatus
 ? `<span><span class="dot new"></span>Thêm mới</span><span><span class="dot change"></span>Thay đổi</span><span><span class="dot keep"></span>Giữ nguyên</span><span><span class="dot na"></span>Ngoài phạm vi</span><span>· badge xám = công nghệ</span>`
 : `<span>Badge xám = công nghệ của khối · mũi tên = luồng gọi</span>`;

// layers + blocks
const layers=document.getElementById('layers');
DATA.layers.forEach(l=>{
  const row=el('div','layer');
  row.appendChild(el('div','llabel',`${l.name}${l.note?`<small>${l.note}</small>`:''}`));
  const bs=el('div','blocks');
  l.blocks.forEach(b=>{
    const st=DATA.showStatus?(b.status||'keep'):'';
    const card=el('div','block'+(st?' '+st:''));
    card.dataset.block=b.id;
    card.dataset.text=(b.name+' '+(b.serves||'')+' '+(b.techs||[]).join(' ')+' '+(b.desc||'')).toLowerCase();
    card.innerHTML=`<div class="bname">${b.name}${DATA.showStatus&&STAG[b.status]?`<span class="stag ${b.status}">${STAG[b.status]}</span>`:''}</div>
      ${b.serves?`<div class="bserves">${b.serves}</div>`:''}
      ${b.desc?`<div class="bdesc">${b.desc}</div>`:''}
      <div class="techs">${(b.techs||[]).map(t=>`<span class="tech">${t}</span>`).join('')}</div>`;
    bs.appendChild(card);
  });
  row.appendChild(bs); layers.appendChild(row);
});

// flows
if(DATA.flows&&DATA.flows.length){
  document.getElementById('flows').innerHTML=`<div class="flows"><h3>🔀 Luồng chính (end-to-end)</h3>
    ${DATA.flows.map(f=>`<div class="flow"><b>${f.name}:</b> <span class="st">${f.steps}</span></div>`).join('')}</div>`;
}

// edges (SVG connectors)
function drawEdges(){
  const wrap=document.getElementById('diagram'), svg=document.getElementById('edges');
  const wr=wrap.getBoundingClientRect();
  svg.setAttribute('width',wrap.offsetWidth); svg.setAttribute('height',wrap.offsetHeight);
  let s=`<defs><marker id="arw" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="${'#9aa4b2'}"/></marker></defs>`;
  (DATA.edges||[]).forEach(e=>{
    const a=document.querySelector(`[data-block="${e.from}"]`), b=document.querySelector(`[data-block="${e.to}"]`);
    if(!a||!b)return;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    const sameRow=Math.abs(ra.top-rb.top)<24;
    let sx,sy,tx,ty;
    if(sameRow){ const l2r=ra.left<rb.left; sx=(l2r?ra.right:ra.left)-wr.left; sy=ra.top+ra.height/2-wr.top; tx=(l2r?rb.left:rb.right)-wr.left; ty=rb.top+rb.height/2-wr.top;
      const mx=(sx+tx)/2; s+=`<path d="M${sx},${sy} C${mx},${sy} ${mx},${ty} ${tx},${ty}" fill="none" stroke="#c3cad4" stroke-width="1.6" marker-end="url(#arw)"/>`; return; }
    const down=rb.top>ra.top;
    sx=ra.left+ra.width/2-wr.left; sy=(down?ra.bottom:ra.top)-wr.top;
    tx=rb.left+rb.width/2-wr.left; ty=(down?rb.top:rb.bottom)-wr.top;
    const my=(sy+ty)/2;
    s+=`<path d="M${sx},${sy} C${sx},${my} ${tx},${my} ${tx},${ty}" fill="none" stroke="#c3cad4" stroke-width="1.6" marker-end="url(#arw)"/>`;
  });
  svg.innerHTML=s;
}
let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(drawEdges,120);});
window.addEventListener('load',drawEdges); drawEdges();

// search highlight
document.getElementById('q').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.block').forEach(b=>{
    const hit=q&&b.dataset.text.includes(q);
    b.classList.toggle('hot',!!hit);
    b.classList.toggle('dim', !!q && !b.dataset.text.includes(q));
  });
});
</script>
</body>
</html>
